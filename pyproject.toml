[project]
name = "blenderlore-eval"
version = "0.1.0"
description = "Harbor evaluator for BlenderLore Blender tasks"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
judge = ["openai>=1.55", "pyyaml>=6.0"]

[tool.setuptools.packages.find]
include = ["eval*"]

[project.scripts]
blenderlore-eval = "eval.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
